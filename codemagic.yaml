workflows:
  phone-dialer-debug:
    name: Phone Dialer Debug APK

    environment:
      java: 17

    cache:
      cache_paths:
        - ~/.gradle/caches
        - ~/.gradle/wrapper

    scripts:
      - name: Make Gradle executable
        script: |
          chmod +x gradlew

      - name: Check Gradle Wrapper
        script: |
          ls -la
          ls -la gradle/wrapper

      - name: Show Gradle Version
        script: |
          ./gradlew --version

      - name: Build Debug APK
        script: |
          ./gradlew assembleDebug --stacktrace

    artifacts:
      - app/build/outputs/apk/debug/*.apk
      - app/build/reports/**

    publishing:
      email:
        recipients:
          - your@email.com
